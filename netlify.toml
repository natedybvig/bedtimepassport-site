# Netlify settings for bedtimepassport.com
# The site is plain HTML: no build step, publish this folder as-is.
[build]
  publish = "."
  command = ""


[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Private Book 1 preview: keep it out of search engines.
# (Not listed in robots.txt on purpose, so the address stays unadvertised.)
[[headers]]
  for = "/preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
