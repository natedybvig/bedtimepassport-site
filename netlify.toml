# Netlify settings for bedtimepassport.com
# The site is plain HTML: no build step, publish this folder as-is.
[build]
  publish = "."
  command = ""


[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
